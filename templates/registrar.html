<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar medición</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    .card { max-width: 420px; margin: 0 auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 20px; color: #2c3e50; margin-top: 0; }
    label { display: block; font-weight: bold; margin-top: 14px; margin-bottom: 4px; font-size: 14px; }
    select, input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 18px; padding: 12px; background: #2E7D9A; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; }
    a { display: block; text-align: center; margin-top: 14px; color: #2E7D9A; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Registrar medición de temperatura</h1>
    <form method="POST">
      <label for="linea">Línea / equipo</label>
      <select name="linea" id="linea" required>
        <option>Cámara fría 1</option>
        <option>Cámara fría 2</option>
        <option>Vehículo de reparto A</option>
        <option>Góndola refrigerada</option>
      </select>

      <label for="temperatura">Temperatura medida (°C)</label>
      <input type="number" step="0.1" name="temperatura" id="temperatura" required placeholder="Ej: 5.4">

      <label for="operario">Operario</label>
      <input type="text" name="operario" id="operario" required placeholder="Tu nombre">

      <button type="submit">Guardar medición</button>
    </form>
    <a href="/dashboard">Ver panel de mediciones →</a>
  </div>
</body>
</html>
